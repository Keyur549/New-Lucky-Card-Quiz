<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1f2430;--muted:#6b7280;--accent:#7c3aed;--accent2:#f59e0b;--line:#e5e7eb;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141220;--card:#1f1d2e;--ink:#f1f0f6;--muted:#a1a1b5;--line:#33314a;}}
*{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
h1{font-size:1.3rem;} h2{font-size:1.05rem;color:var(--accent);}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;}
.btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;margin:4px 6px 4px 0;}
.btn.secondary{background:var(--accent2);} .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
input,textarea{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 10px;}
.code{font-size:1.6rem;font-weight:800;letter-spacing:3px;color:var(--accent);}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.timer{font-size:2rem;font-weight:800;color:#dc2626;}
.qtext{font-size:1.05rem;font-weight:600;background:var(--bg);padding:10px;border-radius:10px;}
.muted{color:var(--muted);font-size:.85rem;}
ul{padding-left:18px;} .pill{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.75rem;margin:2px;}
.overflow{overflow-x:auto;}
.stbl{width:100%;font-size:.8rem;border-collapse:collapse;border:1px solid var(--line);}
.stbl th,.stbl td{border:1px solid var(--line);padding:7px 8px;}
.stbl th{background:var(--accent);color:#fff;font-weight:700;}
.stbl tr:nth-child(even) td{background:rgba(124,58,237,.06);}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.big-winner{position:relative;overflow:hidden;text-align:center;background:linear-gradient(160deg,var(--accent),var(--accent2));color:#fff;padding:34px 12px;animation:pop .6s ease-out;border-radius:18px;
  box-shadow:0 0 0 3px rgba(255,215,0,.55), 0 0 40px 8px rgba(255,215,0,.35); animation:pop .6s ease-out, glowPulse 1.8s ease-in-out infinite;}
.big-winner::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:sweep 2.6s ease-in-out infinite;pointer-events:none;}
.big-winner .crown{font-size:3.2rem;animation:crownPulse 1.3s ease-in-out infinite;display:inline-block;}
.big-winner .win-cat{font-size:2.3rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;
  background:linear-gradient(90deg,#fff6c8,#ffd700,#fff6c8);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 22px rgba(255,215,0,.55); animation:shimmer 2s linear infinite;}
.big-winner .win-avatar{font-size:4.2rem;margin-top:10px;animation:pop .8s ease-out;}
.big-winner .win-name{font-size:2.1rem;font-weight:800;margin-top:4px;} .big-winner .win-zone{font-size:1.1rem;opacity:.92;}
.spark{position:absolute;font-size:1.3rem;animation:twinkle 1.6s ease-in-out infinite;pointer-events:none;}
@keyframes shimmer{to{background-position:-200% center;}}
@keyframes crownPulse{0%,100%{transform:scale(1) rotate(-5deg);}50%{transform:scale(1.18) rotate(5deg);}}
@keyframes sweep{0%{left:-60%;}100%{left:130%;}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 3px rgba(255,215,0,.55),0 0 40px 8px rgba(255,215,0,.32);}50%{box-shadow:0 0 0 3px rgba(255,215,0,.85),0 0 60px 14px rgba(255,215,0,.55);}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7) rotate(0deg);}50%{opacity:1;transform:scale(1.25) rotate(20deg);}}
.winmini{position:relative;overflow:hidden;border-radius:14px;padding:14px 6px;text-align:center;
  animation:pop .5s ease-out, glowPulse 1.8s ease-in-out infinite;
  box-shadow:0 0 0 2px rgba(255,215,0,.6), 0 0 16px 3px rgba(255,215,0,.35);}
.winmini::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;

.winmini .mcrown{font-size:1.3rem;animation:crownPulse 1.3s ease-in-out infinite;display:inline-block;}
.winmini .mlbl{font-size:.72rem;font-weight:900;letter-spacing:.5px;text-transform:uppercase;
  background:linear-gradient(90deg,#fff6c8,#ffd700,#fff6c8);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 2.4s linear infinite;}
.winmini .mav{font-size:2rem;margin:4px 0 2px;animation:pop .8s ease-out;} .winmini .mnm{font-size:1.1rem;font-weight:800;color:#fff;} .winmini .mzn{font-size:.7rem;color:rgba(255,255,255,.85);}
.winmini .mspark{position:absolute;font-size:.9rem;animation:twinkle 1.6s ease-in-out infinite;pointer-events:none;}
.numpop{text-align:center;background:linear-gradient(160deg,#7c3aed,#f59e0b);color:#fff;border-radius:22px;padding:30px 20px;
  box-shadow:0 0 0 3px rgba(255,215,0,.6), 0 0 50px 10px rgba(255,215,0,.4); animation:popBig .45s cubic-bezier(.17,.89,.32,1.49);}
.numpop .lbl{font-size:1.1rem;font-weight:700;letter-spacing:1px;opacity:.9;text-transform:uppercase;}
.numpop .num{font-size:5rem;font-weight:900;line-height:1.1;text-shadow:0 0 24px rgba(255,255,255,.6);}
@keyframes popBig{0%{transform:scale(.3);opacity:0;}70%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);}}
</style>

<script>
const socket = io();
const DEFAULT_QA=[
 ['જીવને માયામાંથી તારીને ભગવાનના દિવ્ય સ્વરૂપમાં જોડવા માટે સંતો દ્વારા અખંડ કથા-વાર્તા અને વિચરણ કરીને કરવામાં આવતા ભારે આધ્યાત્મિક પરિશ્રમને શું કહેવાય?','દાખડો'],

 ['સત્સંગમાંથી ક્યારેય ન પડાય (વિમુખ ન થવાય) તે માટે સ્વામીએ કેટલા સારા સાધુ અને કેટલા સારા હરીભક્તો સાથે જીવ બાંધવા કહ્યું છે','બે અને ત્રણ'],
 ['ભગવાન, સંતો, હરિભક્તો કે સત્સંગની વ્યવસ્થાઓ વિશે નકારાત્મક વાતો કરવી કે દોષ જોવાને સત્સંગની ભાષામાં શું કહેવાય?','અભાવ અવગુણ'],
 ['સ્વામીના વચન અનુસાર આપણે આપણા પોતાના સ્વરૂપને કેવું માનવું જોઈએ?','અક્ષર'],
 ['જો પોતાના સ્વરૂપને અક્ષર ન માની શકાય, તો પણ કઈ બાબતની પોતાને ના માનવું?','સ્થૂળ દેહ'],

 ['સત્સંગમાં ભક્તોના આધ્યાત્મિક વિકાસને સમજાવવા સ્વામીએ કોનું ઉદાહરણ આપ્યું છે?','વામનજીની લાકડી'],

 ['ભગવાન અને સાધુનો સાચો મહિમા સમજવાનું કારણ (સાધન) શું છે?','ભગવદીનો પ્રસંગ'],
 ['દુષ્કાળ, રોગચાળો, આર્થિક સંકટ, કુદરતી આફતો કે જીવનમાં આવતી કોઈપણ વિપરીત અને પ્રતિકૂળ પરિસ્થિતિને સામાન્ય રીતે શું કહેવાય?','દેશકાળની અવરાઈ'],

 ['આધ્યાત્મિક માર્ગમાં સૌથી બળવાન તત્વ કયું દર્શાવવામાં આવ્યું છે?','શબ્દ'],
 ['સ્વામીના મતે જીવ સૌથી શ્રેષ્ઠ અને ઉત્તમ રીતે શેનાથી શુદ્ધ થાય છે?','વાતું'],
 ['આધ્યાત્મિક માર્ગમાં જીવને બળવાન બનાવવાનું સૌથી મોટું સાધન કયું છે?','મહિમા'],
 ['દેહના દુશ્મન કોણ કદી હોય નહિ? જેમ કરશે તેમ સુખ જ થાશે.','હરિ'],
 ['દિવ્યભાવ ને મનુષ્યભાવ એ બેને એક સમજે તે શેને તરી રહ્યો છે?','માયા'],
 ['આઠે પહોર ભજન કરવું જે, "હું દેહ નથી ને દેહમાં રહ્યો એવો જે હું કોણ છું?"','આત્મા'],
 ['જેમ નાતનો, નામનો અને ગામનો નિશ્ચય થયો છે, તેમ જ એવું શુ કરવું જોઈએ?, "હું આત્મા છું, બ્રહ્મ છું, સુખરૂપ છું"','અભ્યાસ'],
 ['ભગવાન પુરુષોત્તમ નારાયણ સર્વ અવતારના કોણ છે?','અવતારી'],
 ['ભગવાન જ્યારે પૃથ્વી ઉપર આવે ત્યારે રાજસી, તામસી, સાત્ત્વિક ને શેનો ઉદ્ધાર કરી નાખે છે?','અધમ'],
 ['નિત્યે લાખ રૂપિયા લાવે ને સત્સંગનું શું બોલતો હોય તો તે મને ન ગમે?','ઘસાતું'],
 ['અમારો મત એવો જે, ક્રિયા કરવામાં પણ ક્રિયારૂપ ન થાવું ને ક્રિયા મૂકીને પણ તેના શું ન કરવા?','મનસૂબા'],
 ['ભગવાનના કર્તાપણાની સમજણ ન હોય તો મુશ્કેલ દેશકાળમાં શું નુકસાન થાય છે?','સત્સંગ ચૂંથાઈ જાય'],
 ['સ્વામીના વચન મુજબ, કોઈ વ્યક્તિ રોજ કેટલું કમાઈને લાવે તો પણ જો સત્સંગનું ઘસાતું બોલે તો સ્વામીને ગમતું નથી?','લાખ રૂપિયા'],
 ['મહારાજના વચનામૃતના આધારે, જો ભક્તમાં કામ-લોભ ન હોય પણ ભગવાનના ભક્તમાં જીવન બંધાયો હોય તો તેનું શું પરિણામ આવે છે?','અસુર'],
 ['‘સ્વામિનારાયણ’ મહામંત્રના જાપથી કયા બાહ્ય સંકટનું ઝેર પણ ચડતું નથી?','કાળો નાગ'],
 ['‘સ્વામિનારાયણ’ મંત્ર કયા મોટા બંધનોમાંથી મુક્તિ અપાવે છે?','કાળ, કર્મ, માયા'],
 ['સ્વામીના મતે આજની તારીખે કયો મંત્ર સૌથી વધુ બળિયો (શક્તિશાળી) છે?','સ્વામિનારાયણ'],
 ['સ્વામીના મતે દેહ આપણી પાસે રોજ શું કરાવે છે?','નરક']

function loadQAIntoTextarea(){
  const ta=document.getElementById('qaText');
  if(ta) ta.value=DEFAULT_QA.map(([q,a])=>q+'::'+a).join('\n');
}
let state={code:null, room:null, loginErr:''};
let hostLoggedIn=false, lastSpokenIdx=null, audioOn=true;
const WINNER_ORDER=['line1','line2','line3','line4','line5','full','bonus'];
const WINNER_LABELS={line1:'1 Line',line2:'2 Line',line3:'3 Line',line4:'4 Line',line5:'5 Line',full:'Full House',bonus:'⭐ Bonus Winner'};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

let currentUtterance=null;
function toggleAudio(){ audioOn=!audioOn; if(!audioOn && 'speechSynthesis' in window) window.speechSynthesis.cancel(); render(); }
function speakQuestion(text, force){
  if(!('speechSynthesis' in window)){ if(force) alert('આ browser Speech સપોર્ટ નથી કરતું.'); return; }
  if(!audioOn && !force) return;
  const synth=window.speechSynthesis;
  const doSpeak=()=>{
    const voices=synth.getVoices();
    const gv=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('gu'));
    if(force && voices.length===0){ alert('આ device પર કોઈ TTS voice મળી નથી.'); return; }
    const u=new SpeechSynthesisUtterance(text);
    u.lang='gu-IN'; u.rate=0.95; if(gv) u.voice=gv;
    if(force) u.onerror=(e)=>alert('Speech Error: '+(e.error||'unknown'));
    currentUtterance=u; // keep a strong reference so Chrome doesn't garbage-collect it mid-speech
    synth.speak(u);
  };
  try{
    if(synth.speaking||synth.pending) synth.cancel();
    setTimeout(()=>{ if(synth.getVoices().length) doSpeak(); else synth.onvoiceschanged=doSpeak; }, 150);
  }catch(e){ if(force) alert('Audio error: '+e.message); }
}
setInterval(()=>{ if('speechSynthesis' in window && window.speechSynthesis.paused) window.speechSynthesis.resume(); },4000);

let wheelRotation=0, spinning=false, lastWheelIdx=null;
let pendingReveal=null;   // number (1-based) that just landed but stays visible until the NEXT spin starts
let wheelLayout=null;     // frozen list of currently-shown numbers (shrinks by 1 each spin)
function computeLayout(r){
  const total=r.questions.length;
  const used=new Set(r.usedIdx);
  if(pendingReveal!=null) used.delete(pendingReveal-1);
  if(r.curIdx!=null && (r.status==='spinning'||r.status==='revealing'||r.status==='question')) used.delete(r.curIdx);
  const nums=[]; for(let i=1;i<=total;i++) if(!used.has(i-1)) nums.push(i);
  return nums;
}
function wheelSVG(numbers, rotation, highlightNumber){
  const total=Math.max(numbers.length,1), R=132,C=142,seg=360/total;
  const colors=['#7c3aed','#f59e0b','#16a34a','#0ea5e9','#e11d48','#9333ea'];
  let paths='';
  numbers.forEach((num,i)=>{
    const a0=i*seg-90, a1=a0+seg;
    const x1=C+R*Math.cos(a0*Math.PI/180), y1=C+R*Math.sin(a0*Math.PI/180);
    const x2=C+R*Math.cos(a1*Math.PI/180), y2=C+R*Math.sin(a1*Math.PI/180);
    const large=seg>180?1:0;
    const fill=colors[(num-1)%colors.length];
    const ring=num===highlightNumber?'stroke="#ffd700" stroke-width="3"':'stroke="#1f1d2e" stroke-width="1"';
    paths+=`<path d="M${C},${C} L${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${fill}" ${ring}/>`;
    const mid=(a0+a1)/2, lx=C+(R*0.7)*Math.cos(mid*Math.PI/180), ly=C+(R*0.7)*Math.sin(mid*Math.PI/180);
    paths+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="#fff" font-size="${total>24?11:13}" font-weight="700" text-anchor="middle" dominant-baseline="middle">${num}</text>`;
  });
  return `<div style="position:relative;width:284px;margin:6px auto;">
  <div style="position:absolute;top:-5px;left:50%;transform:translateX(-50%);font-size:24px;z-index:2;">🔻</div>
  <svg id="wheelSvg" viewBox="0 0 ${2*C} ${2*C}" width="284" height="284" style="transform:rotate(${rotation}deg);will-change:transform;"><g>${paths}</g><circle cx="${C}" cy="${C}" r="23" fill="#1f1d2e" stroke="#fff" stroke-width="2"/></svg>
  </div><div class="muted" style="margin-top:2px">${numbers.length} બાકી</div>`;
}
function computeTargetRotation(pos,total){
  const seg=360/total;
  const targetMod=(((-(pos+0.5)*seg)%360)+360)%360;
  const currentMod=((wheelRotation%360)+360)%360;
  let delta=targetMod-currentMod; if(delta<0) delta+=360;
  return wheelRotation+delta+5*360;
}
let tickAudioCtx=null;
function playTick(){
  try{
    if(!tickAudioCtx) tickAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=tickAudioCtx.createOscillator(), g=tickAudioCtx.createGain();
    o.type='square'; o.frequency.value=1100;
    g.gain.setValueAtTime(.16,tickAudioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,tickAudioCtx.currentTime+.055);
    o.connect(g); g.connect(tickAudioCtx.destination);
    o.start(); o.stop(tickAudioCtx.currentTime+.06);
  }catch(e){}
}
function playSpinTicks(durationMs){
  const totalTicks=34;
  function schedule(i){
    if(i>=totalTicks || !spinning) return;
    playTick();
    const t=i/totalTicks, delay=18+Math.pow(t,2)*170;
    setTimeout(()=>schedule(i+1),delay);
  }
  schedule(0);
}
function playFanfare(){
  try{
    if(!tickAudioCtx) tickAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const now=tickAudioCtx.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((freq,i)=>{
      const o=tickAudioCtx.createOscillator(), g=tickAudioCtx.createGain();
      o.type='triangle'; o.frequency.value=freq;
      const t0=now+i*0.1;
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(.22,t0+.02);
      g.gain.exponentialRampToValueAtTime(.001,t0+.5);
      o.connect(g); g.connect(tickAudioCtx.destination);
      o.start(t0); o.stop(t0+.5);
    });
  }catch(e){}
}
let numberPopup=null, lastRevealIdx=null, lastQuestionIdx=null;
function animateSpinTo(pos,total,idx){
  spinning=true;
  const target=computeTargetRotation(pos,total);
  const startRotation=wheelRotation;
  playSpinTicks(2600);
  render();
  requestAnimationFrame(()=>{
    const el=document.getElementById('wheelSvg');
    const done=()=>{
      spinning=false; wheelRotation=target; render();
      socket.emit('host:spinComplete',{code:state.code, idx}); // tell server our wheel actually stopped — no guessing
    };
    if(!el){ done(); return; }
    // Make sure the browser has actually registered the starting rotation (no transition yet)
    // before we switch on the transition and change to the target — otherwise it can skip
    // straight to the end state instead of animating, which looks like the wheel "freezing".
    el.style.transition='none';
    el.style.transform=`rotate(${startRotation}deg)`;
    void el.offsetHeight; // force a reflow so the browser paints the starting state first
    requestAnimationFrame(()=>{
      el.style.transition='transform 2600ms cubic-bezier(.12,.72,.14,1)';
      el.style.transform=`rotate(${target}deg)`;
      const onDone=()=>{ el.removeEventListener('transitionend',onDone); done(); };
      el.addEventListener('transitionend',onDone);
      setTimeout(()=>{ if(spinning) done(); },2900);
    });
  });
}
// Server drives three synced phases: 'spinning' (wheel turns) -> 'revealing' (big number popup) -> 'question' (full question+timer).
// Every connected client (host and all players) reacts to the SAME broadcast, so timing always matches exactly.
function maybeAnimate(r){
  if(r.status==='spinning' && r.curIdx!=null && r.curIdx!==lastWheelIdx){
    lastWheelIdx=r.curIdx;
    pendingReveal=null; // previous round's number disappears exactly now
    wheelLayout=computeLayout(r);
    const num=r.curIdx+1, pos=wheelLayout.indexOf(num);
    animateSpinTo(pos<0?0:pos, wheelLayout.length, r.curIdx);
  }
  if(r.status==='revealing' && r.curIdx!=null && r.curIdx!==lastRevealIdx){
    lastRevealIdx=r.curIdx;
    pendingReveal=r.curIdx+1; numberPopup=r.curIdx+1;
    playFanfare(); render();
  }
  if(r.status==='question' && r.curIdx!=null && r.curIdx!==lastQuestionIdx){
    lastQuestionIdx=r.curIdx; numberPopup=null; lastSpokenIdx=r.curIdx;
    speakQuestion(r.questions[r.curIdx].q, true); render();
  }
}

function playerResults(r,pname){
  const p=r.players[pname]; const cellState=Array(25).fill('none');
  Object.entries(p.marks).forEach(([ci,qi])=>{ci=+ci; cellState[ci]=(r.questions[qi]&&r.questions[qi].a===p.card[ci])?'green':'red';});
  const usedAnswers=r.usedIdx.map(i=>r.questions[i].a);
  for(let ci=0;ci<25;ci++) if(cellState[ci]==='none'&&usedAnswers.includes(p.card[ci])) cellState[ci]='yellow';
  const LINES=(()=>{const L=[];for(let x=0;x<5;x++)L.push([0,1,2,3,4].map(c=>x*5+c));for(let x=0;x<5;x++)L.push([0,1,2,3,4].map(y=>y*5+x));L.push([0,6,12,18,24]);L.push([4,8,12,16,20]);return L;})();
  const correctRows=LINES.filter(line=>line.every(ci=>cellState[ci]==='green')).length;
  const correctCount=cellState.filter(s=>s==='green').length;
  const wrongCount=cellState.filter(s=>s==='red').length;
  const netScore=correctCount-wrongCount;
  const fullHouse=cellState.every(s=>s==='green');
  return {cellState,correctRows,correctCount,wrongCount,netScore,fullHouse};
}

  let body=`<h1>🎛️ Host Dashboard</h1>
  <div class="card">
    <div class="muted">Room Code</div><div class="code">${esc(r.code)}</div>
    ${r.status==='lobby'&&qrDataUrl(playerLink())?`<div style="text-align:center;margin:8px 0"><img src="${qrDataUrl(playerLink())}" width="220" height="220" style="background:#fff;padding:8px;border-radius:12px"><div class="muted">📱 Scan કરતા જ Join પેજ ખુલશે (Code ભરેલો હશે)</div></div>`:''}
    <button class="btn secondary" onclick="sharePlayerLink()">📤 Player Link Share કરો</button>
    <button class="btn ghost" onclick="copyRoomCode()">🔗 Room Code Copy કરો</button>
    <div class="muted">Players Joined</div><div class="code">${Object.keys(r.players).length}${r.maxPlayers?' / '+r.maxPlayers:''}</div>
    <div class="row">${Object.keys(r.players).map(n=>`<span class="pill">${r.players[n].avatar||''} ${esc(n)}${r.players[n].zone?' · '+esc(r.players[n].zone):''}</span>`).join('')||'<span class="muted">કોઈ player joined નથી</span>'}</div>
  </div>`;
  if(!spinning) wheelLayout=computeLayout(r);
  if(r.status==='lobby') body+=`<div class="card"><button class="btn" onclick="hostStart()">▶ Start Game</button></div>`;
  else if(r.status==='active'||r.status==='locked'){
    body+=`<div class="card" style="text-align:center">${wheelSVG(wheelLayout,wheelRotation,pendingReveal)}
    <button class="btn" onclick="hostSpin()" ${spinning?'disabled':''}>🎡 Spin Wheel</button> <button class="btn ghost" onclick="hostEnd()">End Game</button><div class="muted">Used: ${r.usedIdx.length}/${r.questions.length}</div></div>`;
  }
  else if(r.status==='spinning'){
    body+=`<div class="card" style="text-align:center">${wheelSVG(wheelLayout,wheelRotation,pendingReveal)}
    <div class="qtext">🎡 Spin થઈ રહ્યું છે...</div></div>`;
  }
  else if(r.status==='revealing'){
    body+=`<div class="card" style="text-align:center">${wheelSVG(wheelLayout,wheelRotation,pendingReveal)}</div>`;
    body+=`<div class="card numpop"><div class="lbl">🎯 Question Number</div><div class="num">${numberPopup!=null?numberPopup:(r.curIdx+1)}</div></div>`;
  }
  else if(r.status==='question'){
    body+=`<div class="card" style="text-align:center">${wheelSVG(wheelLayout,wheelRotation,pendingReveal)}</div>`;
    const remain=Math.max(0,Math.ceil((r.timerEnd-Date.now())/1000));
    body+=`<div class="card"><div class="qtext">${esc(r.questions[r.curIdx].q)}</div>${r.questions[r.curIdx].img?`<img src="${esc(r.questions[r.curIdx].img)}" style="max-width:100%;max-height:260px;border-radius:12px;margin:8px auto;display:block" onerror="this.style.display='none'">`:''}<div class="timer">${remain}s</div>
    <button class="btn secondary" onclick='speakQuestion(${JSON.stringify(r.questions[r.curIdx].q)},true)'>🔊 સાંભળો</button>
    <button class="btn ghost" onclick="toggleAudio()">${audioOn?'🔊 Auto On':'🔇 Auto Off'}</button>
    <button class="btn ghost" onclick="hostEnd()">End Game</button></div>`;
  } else if(r.status==='ended') body+=`<div class="card"><button class="btn" onclick="hostReveal()">🏆 Reveal Results</button></div>`;
  if(r.status!=='revealed'){
    const claims=[]; for(const [n,p] of Object.entries(r.players)) for(const [t,c] of Object.entries(p.claims||{})) claims.push({n,t,ts:c.ts});
    claims.sort((a,b)=>a.ts-b.ts);
    body+=`<div class="card"><h2>Live Claim Board</h2>${claims.length?'<ul>'+claims.map(c=>`<li>${esc(c.n)} — ${esc(c.t)} <span class="muted">(${fmtTime(c.ts)})</span></li>`).join('')+'</ul>':'<div class="muted">હજુ કોઈ claim નથી</div>'}</div>`;
  }
  if(r.status==='revealed'){
    const step=r.revealStep||0;
    body+=winnerBannerHTML(r);
    body+=`<div class="card">${step<=WINNER_ORDER.length?`<button class="btn" onclick="hostNextWinner()">▶ Next Winner Reveal કરો</button>`:'<div class="muted">બધા Winners reveal થઈ ગયા 🎉</div>'}
    <button class="btn secondary" onclick="downloadExcel()">⬇ Excel Report (.xlsx)</button></div>`;
    body+=zoneTableHTML(r,n=>playerResults(r,n));
    body+=`<div class="card overflow"><h2>Player Results</h2><div class="muted">Net Score = Correct − Wrong (negative marking)</div><table class="stbl">
    <tr><th align="left">Player</th><th>Correct</th><th>Wrong</th><th>Net</th><th>Lines</th><th>Full</th></tr>
    ${Object.keys(r.players).map(n=>({n,res:playerResults(r,n)})).sort((a,b)=>b.res.netScore-a.res.netScore).map(({n,res})=>{
    return `<tr><td>${esc(n)}</td><td align="center">${res.correctCount}</td><td align="center">${res.wrongCount}</td><td align="center" style="color:${res.netScore<0?'#dc2626':'#16a34a'};font-weight:700">${res.netScore}</td><td align="center">${res.correctRows}</td><td align="center">${res.fullHouse?'✔':'—'}</td></tr>`;}).join('')}
    </table></div>`;
  }
  el.innerHTML=body;
}
setInterval(()=>{ if(state.room && state.room.status==='question' && !spinning) render(); },1000);
render();
if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())); caches && caches.keys && caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))); }
</script>
</body>
</html>
